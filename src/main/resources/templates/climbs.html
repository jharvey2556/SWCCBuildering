<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>SWCC Buildering</title>
</head>
<body>
    <h1>All Routes</h1>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Grade</th>
                <th>Stars</th>
                <th>Location</th>
                <th>Description</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="climb : ${climbs}">
                <td th:text="${climb.id}">1</td>
                <td><a th:href="@{/climbs/{id}(id=${climb.id})}" th:text="${climb.name}">Climb name</a></td>
                <td th:text="${climb.grade}">Grade</td>
                <td th:text="${climb.stars}">Stars</td>
                <td th:text="${climb.location}">Location</td>
                <td th:text="${climb.description}">Description</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
