<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${climb.name}">Climb Detail</title>
</head>
<body>
    <h1 th:text="${climb.name}">Climb Detail</h1>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Grade</th>
                <th>Stars</th>
                <th>Location</th>
                <th>Description</th>
            </tr>
        </thead>
        <tbody>
            <td th:text="${climb.id}">1</td>
            <td th:text="${climb.name}">Climb name</td>
            <td th:text="${climb.grade}">Grade</td>
            <td th:text="${climb.stars}">Stars</td>
            <td th:text="${climb.location}">Location</td>
            <td th:text="${climb.description}">Description</td>
        </tbody>
    </table>
</body>
</html>
